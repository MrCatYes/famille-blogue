{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <p class="meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ if ne .Lastmod .Date }} · mis à jour le {{ .Lastmod.Format "2006-01-02" }}{{ end }}
  </p>
  {{ .Content }}
</article>
<p class="back"><a href="{{ "/" | relURL }}">← Tous les billets</a></p>
{{ end }}
